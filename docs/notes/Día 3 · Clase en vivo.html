<!DOCTYPE html>
<!-- saved from url=(0035)https://bcp-dia3.yefri.workers.dev/ -->
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Día 3 · Clase en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com/"><link rel="stylesheet" href="./Día 3 · Clase en vivo_files/css2">
<style>
:root{--bg:#111317;--surface:#171a20;--line:#2a2f39;--fg:#eceef2;--fg-2:#c3c8d1;--muted:#8d94a1;--accent:#a6c4ff;--ok:#8fd3a5;--warn:#e8c48a;
--font:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);min-height:48px}
.brand{font-size:14px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.brand b{color:var(--fg)}
#title{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:center}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(143,211,165,.15)}
.off .dot{background:var(--warn)}
main{position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;transition:opacity .25s}
iframe.on{opacity:1}
#idle{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;gap:10px}
#idle h1{margin:0;font-size:clamp(24px,3vw,34px);font-weight:650;letter-spacing:-.02em}
#idle p{margin:0;color:var(--muted);font-size:17px;max-width:44ch}
@media(max-width:600px){#title{display:none}}
@media(prefers-reduced-motion:reduce){iframe{transition:none}}
</style></head><body>
<header>
  <div class="brand"><b>Día 3</b> · SDD y agentes</div>
  <div id="title">Un cambio, tres controles</div>
  <div class="status live" id="status"><span class="dot"></span><span id="status-text">En vivo</span></div>
</header>
<main>
  <div id="idle" hidden=""><h1>Esperando al profesor</h1><p>Cuando el profesor muestre un gráfico, aparecerá aquí automáticamente. No necesitas recargar.</p></div>
  <iframe id="frame" title="Gráfico de la clase" src="./Día 3 · Clase en vivo_files/patrones-core.html" class="on"></iframe>
</main>
<script>
const frame=document.getElementById('frame'),idle=document.getElementById('idle'),title=document.getElementById('title');
const status=document.getElementById('status'),statusText=document.getElementById('status-text');
let graficos=[],current=null,ws=null,retry=1000;
async function loadList(){try{graficos=await (await fetch('graficos.json',{cache:'no-store'})).json();}catch{graficos=[];}}
async function show(id){
  id=id||null;if(id===current)return;current=id;
  // Un gráfico nuevo publicado después de abrir la página: recarga la lista.
  if(id&&!graficos.find(x=>x.id===id))await loadList();
  if(id!==current)return;
  const g=graficos.find(x=>x.id===id);
  if(!g){frame.classList.remove('on');frame.removeAttribute('src');idle.hidden=false;title.textContent='';return;}
  idle.hidden=true;title.textContent=g.title;
  frame.classList.remove('on');frame.onload=()=>frame.classList.add('on');frame.src=g.file;
}
function setStatus(live){status.className='status '+(live?'live':'off');statusText.textContent=live?'En vivo':'Reconectando…';}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>{setStatus(true);retry=1000;};
  ws.onmessage=e=>{if(e.data==='pong')return;try{show(JSON.parse(e.data).grafico);}catch{}};
  ws.onclose=()=>{setStatus(false);setTimeout(connect,retry);retry=Math.min(retry*2,10000);};
  ws.onerror=()=>{try{ws.close();}catch{}};
}
async function syncNow(){try{show((await (await fetch('/api/state',{cache:'no-store'})).json()).grafico);}catch{}}
// Respaldo si el WebSocket se corta: consulta el estado cada 15 s.
setInterval(()=>{if(ws&&ws.readyState===1)ws.send('ping');else syncNow();},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow();});
loadList().then(()=>{syncNow();connect();});
</script>

</body></html>
